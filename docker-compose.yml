services:
  # ========================================
  # BACKEND SERVICE (FastAPI/TensorFlow)
  # ========================================
  geotech-server:
    build:
      context: ./backend 
      dockerfile: Dockerfile
    container_name: geotech-server
    ports:
      - "8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=-1
      - TF_CPP_MIN_LOG_LEVEL=2
    # ✅ WALA nang volumes - kasama na sa COPY sa Dockerfile
    env_file:
      - ./backend/.env
    restart: always

  # ========================================
  # FRONTEND SERVICE (React/Vite + Nginx)
  # ========================================
  geotech-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geotech-frontend
    ports:
      - "3000:80"
    depends_on:
      - geotech-server
    restart: always